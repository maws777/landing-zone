# Terraform through GitHub Actions, authenticated to AWS with OIDC.
#
#   pull request -> plan         (landing-zone-ci-plan, read-only)
#   push to main -> review-plan  (landing-zone-ci-plan: shows what will change)
#                -> apply        (landing-zone-ci-apply, behind the `management`
#                                 environment: required reviewer, `main` only;
#                                 refuses to run if its plan differs from the
#                                 reviewed one)
#
# The roles and their trust policies live in stages/00-bootstrap/ci-identity.tf.
# 00-bootstrap itself never runs here (ADR 0004).
#
# Plan output is public on this repo; see ADR 0005 for what that exposes.

name: terraform

on:
  pull_request:
    paths:
      - "stages/01-guardrails/**"
      - "stages/02-logging/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "stages/01-guardrails/**"
      - "stages/02-logging/**"
      - ".github/workflows/terraform.yml"

# Default for every job: read the repo, nothing else. Jobs that talk to AWS add
# id-token: write, which is what lets them request an OIDC token at all.
permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_management_account_id: ${{ vars.MANAGEMENT_ACCOUNT_ID }}
  # Terraform state lives in log-archive (ADR 0009). The bucket name and the
  # state roles are built from this ID; see the "Backend config" steps.
  LOG_ARCHIVE_ACCOUNT_ID: ${{ vars.LOG_ARCHIVE_ACCOUNT_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One job per stage. Every stage is planned on every PR: plans are read-only
    # and cheap, and a path filter per stage would be one more thing to get
    # wrong. fail-fast off so one stage's failure doesn't hide the other's plan.
    strategy:
      fail-fast: false
      matrix:
        stage: [01-guardrails, 02-logging]
    permissions:
      contents: read
      id-token: write
    env:
      # Used by 02-logging only; Terraform ignores TF_VAR_ for a variable a
      # stage doesn't declare. The plan role can only chain into its own
      # counterpart in log-archive (00-bootstrap/ci-identity.tf).
      TF_VAR_log_archive_role_name: ci/landing-zone-ci-logging-plan
      # The role the backend assumes in log-archive to read and lock state.
      # Same rule: plan can only reach the read-only one.
      TF_STATE_ROLE: ci/landing-zone-ci-state-plan
    defaults:
      run:
        working-directory: stages/${{ matrix.stage }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to new
      # code, a SHA can't. These jobs hold AWS credentials, so that matters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prints the claims AWS will check, never the token itself. If the role
      # refuses the token, this is the first thing to compare with the trust
      # policy.
      - name: Show OIDC claims
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, ref, event_name, environment}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/ci/landing-zone-ci-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
          # The wrapper captures stdout into step outputs; not needed here, and
          # it makes plan output harder to read in the log.
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      # The backend reads state with its own credentials: the job's role
      # chains into TF_STATE_ROLE in log-archive (ADR 0009). A nested
      # assume_role can't be passed as -backend-config=key=value, so it goes
      # in a file, written on the runner and never committed.
      - name: Backend config
        run: |
          cat > ci.s3.tfbackend <<EOF
          bucket = "landing-zone-tfstate-${LOG_ARCHIVE_ACCOUNT_ID}"
          assume_role = {
            role_arn     = "arn:aws:iam::${LOG_ARCHIVE_ACCOUNT_ID}:role/${TF_STATE_ROLE}"
            session_name = "github-${GITHUB_RUN_ID}"
          }
          EOF
      - run: terraform init -backend-config=ci.s3.tfbackend
      - run: terraform validate -no-color
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      # The log has the plan too, but four clicks deep. The job summary shows
      # up on the run page, linked from the PR's checks.
      - name: Plan summary
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### ${{ matrix.stage }}: $(grep -E '^(Plan:|No changes\.)' plan.txt || echo 'see log')"
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # After a merge: plan main with the read-only role, before anyone is asked to
  # approve anything. Its summary is on the same run page as the "Review
  # deployments" button, so the approver sees exactly what main would change.
  #
  # Why not just apply a saved plan file from here? It would be stamped with
  # this job's variables, including the read-only log-archive role, so the
  # apply would run with the wrong role. Instead this job records a digest of
  # the planned changes, and the apply job refuses to run if its own fresh
  # plan has a different one.
  review-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [02-logging, 01-guardrails]
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_log_archive_role_name: ci/landing-zone-ci-logging-plan
      TF_STATE_ROLE: ci/landing-zone-ci-state-plan
    defaults:
      run:
        working-directory: stages/${{ matrix.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show OIDC claims
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, ref, event_name, environment}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/ci/landing-zone-ci-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      # The backend reads state with its own credentials: the job's role
      # chains into TF_STATE_ROLE in log-archive (ADR 0009). A nested
      # assume_role can't be passed as -backend-config=key=value, so it goes
      # in a file, written on the runner and never committed.
      - name: Backend config
        run: |
          cat > ci.s3.tfbackend <<EOF
          bucket = "landing-zone-tfstate-${LOG_ARCHIVE_ACCOUNT_ID}"
          assume_role = {
            role_arn     = "arn:aws:iam::${LOG_ARCHIVE_ACCOUNT_ID}:role/${TF_STATE_ROLE}"
            session_name = "github-${GITHUB_RUN_ID}"
          }
          EOF
      - run: terraform init -backend-config=ci.s3.tfbackend
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Plan summary
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### ${{ matrix.stage }}: $(grep -E '^(Plan:|No changes\.)' plan.txt || echo 'see log')"
            echo "<details open><summary>Full plan</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The digest covers what would change (addresses, actions, before/after
      # values), not how the plan was made, so the same changes planned by the
      # apply role give the same digest. Only the hash leaves this job; the plan
      # file itself is never uploaded.
      - name: Plan digest
        run: |
          terraform show -json tfplan \
            | jq -S '{resources: [.resource_changes[]? | {address, change: (.change | {actions, before, after, after_unknown})}], outputs: .output_changes}' \
            | sha256sum | cut -d' ' -f1 > digest.txt
          echo "Digest: $(cat digest.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-plan-${{ matrix.stage }}
          path: stages/${{ matrix.stage }}/digest.txt
          retention-days: 7

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: review-plan
    runs-on: ubuntu-latest
    # This line is what the apply role's trust policy checks for: the OIDC `sub`
    # becomes ...:environment:management. It also pauses the job until the
    # environment's required reviewer approves.
    environment: management
    # Stages apply one at a time, each behind its own approval. GitHub starts
    # them in list order in practice but doesn't promise it, so anything that
    # truly depends on another stage (the log-bucket SCP needs the bucket) goes
    # in a later PR, not the same merge.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        stage: [02-logging, 01-guardrails]
    # Never two applies of the same stage at once; queue rather than cancel.
    concurrency:
      group: terraform-apply-${{ matrix.stage }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_log_archive_role_name: ci/landing-zone-ci-logging-apply
      TF_STATE_ROLE: ci/landing-zone-ci-state-apply
    defaults:
      run:
        working-directory: stages/${{ matrix.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show OIDC claims
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, ref, event_name, environment}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/ci/landing-zone-ci-apply
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-plan-${{ matrix.stage }}
          path: stages/${{ matrix.stage }}/reviewed

      # The backend reads state with its own credentials: the job's role
      # chains into TF_STATE_ROLE in log-archive (ADR 0009). A nested
      # assume_role can't be passed as -backend-config=key=value, so it goes
      # in a file, written on the runner and never committed.
      - name: Backend config
        run: |
          cat > ci.s3.tfbackend <<EOF
          bucket = "landing-zone-tfstate-${LOG_ARCHIVE_ACCOUNT_ID}"
          assume_role = {
            role_arn     = "arn:aws:iam::${LOG_ARCHIVE_ACCOUNT_ID}:role/${TF_STATE_ROLE}"
            session_name = "github-${GITHUB_RUN_ID}"
          }
          EOF
      - run: terraform init -backend-config=ci.s3.tfbackend
      # Plan and apply the same saved file, so exactly what's printed is what runs.
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      # The approval was given for review-plan's changes. If anything moved in
      # between (another merge, someone changing AWS by hand), this plan differs
      # and the apply stops: re-run the workflow and review the new plan.
      - name: Match the reviewed plan
        run: |
          digest=$(terraform show -json tfplan \
            | jq -S '{resources: [.resource_changes[]? | {address, change: (.change | {actions, before, after, after_unknown})}], outputs: .output_changes}' \
            | sha256sum | cut -d' ' -f1)
          reviewed=$(cat reviewed/digest.txt)
          echo "reviewed: $reviewed"
          echo "now:      $digest"
          if [ "$digest" != "$reviewed" ]; then
            echo "::error::Plan changed since it was reviewed. Re-run the workflow and review again."
            exit 1
          fi

      - run: terraform apply -no-color -lock-timeout=5m tfplan
